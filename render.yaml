# Optional Blueprint — Free instances (no card required for Free web + Free Postgres).
# Prefer manual setup from README if Blueprint still asks to upgrade.
#
# After first deploy:
# 1. Set APP_HOST to your real hostname (e.g. listingpack.onrender.com)
# 2. Optionally set OPENAI_API_KEY for live AI copy
# 3. Seed once: set SEED_ON_BOOT=true, redeploy once, then set it back to false
#    (Free web has no Render Shell)

databases:
  - name: listingpack-db
    plan: free
    databaseName: listingpack
    user: listingpack

services:
  - type: web
    name: listingpack
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/render-start
    healthCheckPath: /up
    # Free web: no persistent disks. Uploads/PNGs live on ephemeral disk and
    # are wiped on spin-down, restart, or redeploy. Fine for demos; use S3/R2 later.
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: listingpack-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: APP_HOST
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_ON_BOOT
        value: "false"
      - key: RAILS_LOG_LEVEL
        value: info
