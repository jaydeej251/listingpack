# Optional Blueprint — Free instances (no card required for Free web + Free Postgres).
# Prefer manual setup from README if Blueprint still asks to upgrade.
#
# After first deploy:
# 1. Set APP_HOST to your real hostname (e.g. listingpack.onrender.com)
# 2. Optionally set OPENROUTER_API_KEY (or OPENAI_API_KEY) for live AI copy
# 3. Set AWS_* + ACTIVE_STORAGE_SERVICE=cloud so uploads survive Free spin-down
# 4. Set SMTP_* for password reset; PAYMONGO_SECRET_KEY for GCash/Maya checkout
# 5. Seed once: set SEED_ON_BOOT=true, redeploy once, then set it back to false
#    (Free web has no Render Shell)
# 6. Poster PNGs use libvips — no Chromium required on Free tier

databases:
  - name: listingpack-db
    plan: free
    databaseName: listingpack
    user: listingpack

services:
  - type: web
    name: listingpack
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/render-start
    healthCheckPath: /up
    # Free web: no persistent disks. Wire R2/S3 via AWS_* env vars below.
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: listingpack-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "2"
      - key: DB_POOL
        value: "10"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JOB_CONCURRENCY
        value: "1"
      - key: POSTER_RENDERER
        value: "vips"
      - key: POSTER_RENDER_MODE
        value: "sequential"
      - key: APP_HOST
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ACTIVE_STORAGE_SERVICE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_FORCE_PATH_STYLE
        value: "true"
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAILER_FROM
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: SEED_ON_BOOT
        value: "false"
      - key: RAILS_LOG_LEVEL
        value: info
