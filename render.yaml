# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect this repo → apply.
#
# After first deploy:
# 1. Set APP_HOST to your real hostname (e.g. listingpack.onrender.com)
# 2. Optionally set OPENAI_API_KEY for live AI copy
# 3. One-time seed: Render Shell → bin/rails db:seed
#    or set SEED_ON_BOOT=true for a single restart, then turn it off

databases:
  - name: listingpack-db
    plan: basic-256mb
    databaseName: listingpack
    user: listingpack

services:
  - type: web
    name: listingpack
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/render-start
    healthCheckPath: /up
    # Chromium + Rails needs RAM; Free/too-small plans often OOM on poster renders.
    disk:
      name: listingpack-storage
      mountPath: /rails/storage
      sizeGB: 2
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: listingpack-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: APP_HOST
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_ON_BOOT
        value: "false"
      - key: RAILS_LOG_LEVEL
        value: info
